name: Release immutable artifact

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out tagged applications source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          path: dsh-applications
      - name: Check out exact runtime-kit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: sympoies/dsh-runtime-kit
          ref: 2cd14d5fdd73e0758d366d8b671f71ee768d857f
          persist-credentials: false
          path: dsh-runtime-kit
      - name: Check out exact DSH
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          repository: deepseek-ai/deepseek-harness
          ref: b150a551b8d465e31e418e1b2eaf5e79bbb7d28e
          persist-credentials: false
          path: deepseek-harness
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: dsh-applications/package-lock.json
      - name: Activate exact npm
        working-directory: dsh-applications
        run: |
          npm install --global npm@11.6.2 --ignore-scripts
          test "$(npm --version)" = "11.6.2"
      - name: Verify signed reviewed tag
        id: verify-tag
        working-directory: dsh-applications
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          tag_object="$(git rev-parse "refs/tags/$RELEASE_TAG")"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" --jq '.verification.verified')" = true
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" --jq '.verification.reason')" = valid
          git fetch --no-tags origin main
          release_commit="$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"
          git merge-base --is-ancestor "$release_commit" origin/main
          package_version="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$package_version"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release already exists and is immutable" >&2
            exit 1
          fi
      - name: Install without lifecycle scripts
        working-directory: dsh-applications
        run: npm ci --ignore-scripts
      - name: Verify source and compatibility
        working-directory: dsh-applications
        run: |
          npm test
          npm run check:compatibility -- \
            --runtime-kit-root ../dsh-runtime-kit \
            --dsh-root ../deepseek-harness
          npm run verify:package-reproducibility
      - name: Build digest-addressed artifact
        id: package
        working-directory: dsh-applications
        run: |
          mkdir -p dist
          npm pack --ignore-scripts --pack-destination dist
          archive="$(find dist -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          digest="$(sha256sum "$archive" | awk '{print $1}')"
          digest_archive="dist/dsh-applications-${{ github.ref_name }}-sha256-$digest.tgz"
          mv "$archive" "$digest_archive"
          sha256sum "$digest_archive" > dist/SHA256SUMS
          cp compatibility/dsh-applications-lock.json dist/
          echo "artifact=$digest_archive" >> "$GITHUB_OUTPUT"
      - name: Attest artifact provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dsh-applications/${{ steps.package.outputs.artifact }}
      - name: Create immutable release
        working-directory: dsh-applications
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_ARTIFACT: ${{ steps.package.outputs.artifact }}
        run: >-
          gh release create "$RELEASE_TAG"
          "$RELEASE_ARTIFACT"
          dist/SHA256SUMS
          dist/dsh-applications-lock.json
          --verify-tag
          --title "$RELEASE_TAG"
          --generate-notes
