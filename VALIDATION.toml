# Finish-line validation contract. agent-hook and the agent-runtime-kit
# finish-line hooks block a turn that edited files until these commands pass.
# [path_classes] is the project-owned path classification read by nils-cli
# phase-aware test-first and docs-impact checks.

[[validation]]
context = "project-dev"
product = ["codex", "claude", "hermes", "dsh"]
commands = ["npm ci --ignore-scripts", "npm run test:repository-contract", "npm test", "npm run typecheck", "npm run check:compatibility -- --manifest-only", "npm run verify:package-reproducibility", "npm pack --dry-run --ignore-scripts"]
description = "Run the complete routine repository gate once for the stable candidate."

[path_classes]
production = [".gitignore", ".node-version", ".npmrc", "VALIDATION.toml", "package.json", "package-lock.json", "tsconfig.json", "tsconfig.tools.json", ".agents/**", ".github/workflows/**", "compatibility/**", "fixtures/**", "profiles/**", "packages/**", "scripts/**"]
test = ["test/**"]
docs = ["AGENTS.md", "CONTRIBUTING.md", "README.md", "LICENSE", "SECURITY.md", "docs/**"]
unmatched = "unknown"
